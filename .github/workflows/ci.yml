name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Java 21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is the required gate; Windows catches path/FS regressions.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build (clean test build)
        env:
          # Loom + Minecraft remapping needs headroom beyond default 1G
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2G"
        shell: bash
        run: ./gradlew clean test build --stacktrace --no-daemon

  # Building 2.0 Stabilization：专属 check，便于 PR 上看到建筑套件状态
  building-suite:
    name: Building test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Building + geometry + roof stress
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2G"
        run: >
          ./gradlew test --no-daemon --stacktrace
          --tests "com.plot.plugin.building.*"
          --tests "com.plot.core.geometry.polygon.StraightSkeleton*"

  server-smoke:
    name: dedicated-server smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Boot Fabric dedicated server (load Plot, then exit)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2G"
        run: ./gradlew runServerSmoke --stacktrace --no-daemon

      - name: Upload server smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-logs
          path: run-server-smoke/logs/
          if-no-files-found: ignore
