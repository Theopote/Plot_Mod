pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		// 添加 Fabric 快照仓库
		maven {
			name = 'Fabric Snapshots'
			url = 'https://maven.fabricmc.net/snapshots/'
		}
		// Maven Central 在部分地区被 Cloudflare 拦截（403），使用国内镜像
		maven {
			name = 'Aliyun Maven'
			url = 'https://maven.aliyun.com/repository/public'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'plot'