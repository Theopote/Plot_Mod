plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Maven Central 在部分地区被 Cloudflare 拦截（403），Batik 等走阿里云 exclusive
	exclusiveContent {
		forRepository {
			maven {
				name = 'Aliyun Central'
				url = 'https://maven.aliyun.com/repository/central'
			}
		}
		filter {
			includeGroup 'org.apache.xmlgraphics'
		}
	}
	maven {
		name = 'Aliyun Maven'
		url = 'https://maven.aliyun.com/repository/public'
	}
	mavenCentral()
}

loom {
	mods {
		"plot" {
			sourceSet sourceSets.main
		}
	}

	runConfigs.configureEach {
		vmArgs.add("--enable-native-access=ALL-UNNAMED")
		// Prevent OOM during large road/build projections (see crash-2026-08-28_14.13.29-server.txt).
		vmArgs.add("-Xmx4G")
	}

	// Dedicated-server smoke: load Plot on a physical server, then exit.
	runConfigs.register("serverSmoke") {
		server()
		ideConfigGenerated = false
		runDir = "run-server-smoke"
		vmArgs.add("-Dplot.server.smoke=true")
		// Loom server configs already pass nogui; avoid duplicating.
	}
}

def serverSmokeDir = file("run-server-smoke")

tasks.register("prepareServerSmoke") {
	description = "Accept EULA and write a minimal dedicated-server properties file for smoke."
	outputs.dir(serverSmokeDir)
	doLast {
		serverSmokeDir.mkdirs()
		new File(serverSmokeDir, "eula.txt").text = "eula=true\n"
		new File(serverSmokeDir, "server.properties").text = """\
online-mode=false
level-name=smoke
motd=plot-server-smoke
gamemode=creative
max-players=1
view-distance=2
simulation-distance=2
sync-chunk-writes=false
spawn-protection=0
difficulty=peaceful
""".stripIndent()
	}
}

def devRunDir = file("run")

tasks.register("prepareDevRun") {
	description = "Ensure dev integrated-server settings reduce chunk corruption risk on crash."
	doLast {
		devRunDir.mkdirs()
		def props = new File(devRunDir, "server.properties")
		def lines = props.exists() ? props.readLines() : []
		lines = lines.findAll { !it.startsWith("sync-chunk-writes=") }
		lines.add("sync-chunk-writes=true")
		props.text = lines.join(System.lineSeparator()) + System.lineSeparator()
	}
}

afterEvaluate {
	tasks.matching { it.name == "runClient" }.configureEach {
		dependsOn("prepareDevRun")
	}

	def smoke = tasks.named("runServerSmoke")
	smoke.configure {
		dependsOn("prepareServerSmoke")
		doLast {
			def logFile = new File(serverSmokeDir, "logs/latest.log")
			def logText = logFile.exists() ? logFile.getText("UTF-8") : ""
			if (!logText.contains("PLOT_SERVER_SMOKE_PASS")) {
				throw new GradleException(
					"Dedicated-server smoke failed: marker PLOT_SERVER_SMOKE_PASS not found in ${logFile.absolutePath}"
				)
			}
		}
	}
}

fabricApi {
	configureDataGeneration {
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ImGui dependencies - 1.86.12 修复了 #253（createContext 覆盖先前上下文 ptr 的 bug），避免与其他 ImGui 模组冲突
	// 注意：imgui-java-lwjgl3 会传递依赖 org.lwjgl 3.3.4，若一并 jar-in-jar 进 mod，
	// 会覆盖 MC 1.21.10 自带的 lwjgl-stb（3.3.4-snapshot），导致 NativeImage 报
	// STBImageResize.nstbir_resize_uint8 NoSuchMethodError。只打包 imgui 自身，LWJGL 交给 MC。
	def imguiVersion = '1.86.12'
	implementation include("io.github.spair:imgui-java-binding:${imguiVersion}")
	implementation(include("io.github.spair:imgui-java-lwjgl3:${imguiVersion}")) {
		transitive = false
	}
	implementation include("io.github.spair:imgui-java-natives-windows:${imguiVersion}")
	implementation include("io.github.spair:imgui-java-natives-linux:${imguiVersion}")
	implementation include("io.github.spair:imgui-java-natives-macos:${imguiVersion}")

	// SVG 图标支持：使用 Batik Transcoder（避免 batik-all 与 JDK java.xml 的类冲突）
	implementation('org.apache.xmlgraphics:batik-transcoder:1.18') {
		exclude group: 'xml-apis', module: 'xml-apis'
	}

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// 防止 jar-in-jar 误打包 MC 自带的 LWJGL（尤其 lwjgl-stb）
configurations.include {
	exclude group: 'org.lwjgl', module: 'lwjgl'
	exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
	exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
	exclude group: 'org.lwjgl', module: 'lwjgl-stb'
	exclude group: 'org.lwjgl', module: 'lwjgl-jemalloc'
	exclude group: 'org.lwjgl', module: 'lwjgl-openal'
	exclude group: 'org.lwjgl', module: 'lwjgl-tinyfd'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs.addAll(['-Xlint:unchecked', '-Xlint:deprecation'])
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.test {
	useJUnitPlatform()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}